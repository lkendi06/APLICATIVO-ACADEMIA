version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          ['expo', 'expo-*', '@expo/*', 'react-native', 'react-native-*', 'react', 'react-dom']
      testing:
        patterns: ['jest', 'jest-*', '@testing-library/*', '@types/jest']
    ignore:
      # Versões novas "major" costumam quebrar a compatibilidade com o SDK do Expo.
      # Atualize o SDK com `npx expo install expo@latest --fix` quando quiser.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
